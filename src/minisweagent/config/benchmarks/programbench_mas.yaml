agent:
  system_template: |
    You are a helpful software engineering agent that can interact with a computer.
    You may coordinate direct child agents with standalone mini-mas commands when parallel work is useful.
  instance_template: |
    Please solve this ProgramBench task: {{task}}

    You are working in a ProgramBench cleanroom workspace. Reverse-engineer and implement the program behavior needed for the hidden ProgramBench tests.

    ## ProgramBench Submission Contract

    Your final workspace MUST include a build script named `compile.sh` at the workspace root.
    ProgramBench evaluation will extract your submitted workspace and run exactly:

    ```bash
    chmod +x ./compile.sh && ./compile.sh
    ```

    `compile.sh` MUST build or create the candidate program as `./executable` in the workspace root. Hidden tests will execute `./executable`; they will not use manually built binaries with other names unless `compile.sh` copies or builds them to `./executable`.

    Keep `compile.sh` non-interactive and deterministic. It should fail with a nonzero exit status if the build fails. Do not rely on the original black-box `./executable` being present during evaluation; ProgramBench removes known original executable hashes before running `compile.sh`.

    Example patterns:

    ```bash
    # C/C++
    gcc ... -o executable ...

    # Go
    go build -o executable ./...

    # Rust
    cargo build --release
    cp target/release/<binary-name> ./executable

    # Script-based solution
    cp tool.sh executable
    chmod +x executable
    ```

    ## Recommended Workflow

    Work step by step so you can iterate on behavior and build issues.

    1. Inspect the workspace and identify the original black-box program behavior.
    2. Probe the original `./executable` with focused commands and small scripts.
    3. Implement a replacement program and the required `compile.sh`.
    4. Run `./compile.sh` and verify it creates `./executable`.
    5. Compare your `./executable` against the original behavior on representative and edge-case inputs.
    6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Multi-Agent Coordination

    Default to doing the work yourself. Spawn child agents only when there is a clear parallel or investigative benefit, such as independent files or modules, multiple plausible root causes, a narrow research question, or a task large enough that delegation reduces risk or wall-clock time.

    Before spawning child agents, briefly state the split of responsibility: what each child should inspect or change, what output you expect, and how you will verify the result. Give each child a scoped task that states ownership, expected output, and verification. Parent and child agents share the same workspace, so avoid assigning overlapping edits unless coordination is explicitly required.

    Use `mini-mas spawn "task"` to delegate clearly scoped work to direct child agents. Use `mini-mas spawn --wait "task A" "task B"` when you want to wait for at least one spawned child to become observable, and use `mini-mas status` or `mini-mas wait` to inspect or synchronize with direct children.

    You can only status, wait, continue, or close agents that you directly spawned. Do not assume access to siblings, grandchildren, or agents spawned by your parent. Use `mini-mas continue <agent-id> "message"` or `mini-mas close <agent-id>` only when a direct child is waiting for parent direction.

    After child agents report back or become observable, inspect their results before relying on them. You remain responsible for integrating changes, resolving conflicts, running the final relevant verification, and submitting the final answer.

    Stay within the ownership described in your task. Do not edit files outside that scope unless the change is necessary to complete the task; if you do, mention it clearly in your final output.

    ## Command Execution Rules

    You are operating in an environment where

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
    - `mini-mas` commands MUST be issued as standalone commands. Do not combine them with `&&`, pipes, redirection, variable assignments, subshells, or ordinary bash commands.
    - Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    Example of a CORRECT response:
    <example_response>
    I need to understand the workspace and the original executable behavior first. Let me inspect the files and run a basic help command.

    [Makes bash tool call with {"command": "ls -la && ./executable --help 2>&1 | head -80"} as arguments]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    print("hello")
    EOF
    ```

    ### Edit files with sed:

    {%- if system == "Darwin" -%}
    <important>
    You are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.
    </important>
    {%- endif -%}

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
  model_kwargs:
    drop_params: true
